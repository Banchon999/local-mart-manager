<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ร้านค้าของเรา — ระบบจัดการร้านค้า</title>
<script>(function(){try{var t=localStorage.getItem("lmm_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
:root{
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --income:#2a78d6; --expense:#e34948; --seq:#2a78d6;
  --good:#0ca30c; --good-text:#006300; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --income:#3987e5; --expense:#e66767; --seq:#3987e5;
    --good:#0ca30c; --good-text:#0ca30c;
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.15);
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
/* เลือกโหมดเองได้ (ปุ่มสลับ) — ชนะทั้งค่าเริ่มต้นและ prefers-color-scheme เสมอ */
:root[data-theme="light"]{
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --income:#2a78d6; --expense:#e34948; --seq:#2a78d6;
  --good:#0ca30c; --good-text:#006300; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
:root[data-theme="dark"]{
  --surface-1:#1a1a19; --page:#0d0d0d;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --income:#3987e5; --expense:#e66767; --seq:#3987e5;
  --good:#0ca30c; --good-text:#0ca30c;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.15);
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
  background:var(--page); color:var(--ink-1); font-size:15px; line-height:1.5;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:220px;flex-shrink:0;background:var(--surface-1);border-right:1px solid var(--ring);
  padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;
}
.brand{font-size:17px;font-weight:700;padding:6px 12px 18px;display:flex;align-items:center;gap:8px}
.brand .logo{font-size:22px}
.theme-toggle{
  margin-left:auto;border:1px solid var(--ring);background:var(--surface-1);color:var(--ink-2);
  width:30px;height:30px;border-radius:9px;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.theme-toggle:hover{border-color:var(--accent)}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;background:none;
  border-radius:10px;font-size:15px;color:var(--ink-2);text-align:left;
}
.nav-btn:hover{background:var(--accent-soft)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn .ico{font-size:18px;width:22px;text-align:center}
.main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%}
.page-title{font-size:21px;font-weight:700;margin-bottom:4px}
.page-sub{color:var(--ink-3);font-size:13.5px;margin-bottom:20px}

/* mobile */
.topbar{display:none}
@media (max-width:760px){
  .sidebar{display:none}
  .main{padding:16px 14px 90px}
  .topbar{
    display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20;
    background:var(--surface-1);border-bottom:1px solid var(--ring);padding:12px 16px;font-weight:700;font-size:16px;
  }
  .bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:var(--surface-1);border-top:1px solid var(--ring);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .bottomnav button{
    flex:1 0 auto;min-width:52px;border:none;background:none;color:var(--ink-3);font-size:10.5px;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:8px;
  }
  .bottomnav button .ico{font-size:19px}
  .bottomnav button.active{color:var(--accent);font-weight:600}
}
@media (min-width:761px){.bottomnav{display:none}}

/* ---------- Cards & grids ---------- */
.card{background:var(--surface-1);border:1px solid var(--ring);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface-1);border:1px solid var(--ring);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile .t-label{font-size:12.5px;color:var(--ink-3)}
.tile .t-value{font-size:22px;font-weight:700;margin-top:2px}
.tile .t-delta{font-size:12px;margin-top:2px;color:var(--ink-3)}
.tile .up{color:var(--good-text)} .tile .down{color:var(--critical)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);font-size:12.5px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink-3)} .small{font-size:12.5px}

/* ---------- Buttons / forms ---------- */
.btn{
  border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;
  background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:none;border:1px solid var(--ring);color:var(--ink-1)}
.btn.danger{background:var(--critical);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;color:var(--accent);border:none;padding:5px 8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;border:1px solid var(--ring);border-radius:10px;
  background:var(--page);color:var(--ink-1);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{
  flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--ring);border-radius:10px;background:var(--surface-1);color:var(--ink-1);
}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:10px;overflow:hidden;background:var(--surface-1)}
.seg button{border:none;background:none;padding:7px 14px;font-size:13px;color:var(--ink-2)}
.seg button.active{background:var(--accent);color:#fff;font-weight:600}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px}
.badge.ok{background:rgba(12,163,12,.12);color:var(--good-text)}
.badge.low{background:rgba(250,178,25,.16);color:#8a5f00}
.badge.out{background:rgba(208,59,59,.12);color:var(--critical)}
.badge.in{background:var(--accent-soft);color:var(--accent)}
.badge.exp{background:rgba(208,59,59,.12);color:var(--critical)}
@media (prefers-color-scheme: dark){ .badge.low{color:#fab219} }

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface-1);border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:20px}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.hidden{display:none!important}

/* ---------- Charts ---------- */
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tooltip{
  position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--ring);
  border-radius:10px;padding:8px 11px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.18);
  z-index:10;white-space:nowrap;opacity:0;transition:opacity .08s;
}
.tooltip b{font-variant-numeric:tabular-nums}

/* ---------- Sale (POS) ---------- */
.pos-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:900px){.pos-grid{grid-template-columns:1fr}}
.prod-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:430px;overflow-y:auto}
.prod-card{
  border:1px solid var(--ring);border-radius:12px;padding:10px 12px;background:var(--page);
  text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink-1);
}
.prod-card:hover{border-color:var(--accent)}
.prod-card:disabled{opacity:.45;cursor:not-allowed}
.prod-card .p-name{font-weight:600;font-size:13.5px;line-height:1.3}
.prod-card .p-price{color:var(--accent);font-weight:700;font-size:14px}
.prod-card .p-stock{font-size:11.5px;color:var(--ink-3)}
.cart-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid)}
.cart-line .c-name{flex:1;font-size:13.5px}
.qty-ctl{display:inline-flex;align-items:center;gap:2px}
.qty-ctl button{width:26px;height:26px;border-radius:8px;border:1px solid var(--ring);background:var(--surface-1);color:var(--ink-1);font-size:15px}
.qty-ctl span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.cart-total{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding:12px 0 4px}

/* ---------- AI insights ---------- */
.insight{display:flex;gap:12px;padding:14px;border:1px solid var(--ring);border-radius:12px;margin-bottom:10px;background:var(--surface-1)}
.insight .i-ico{font-size:22px;flex-shrink:0}
.insight .i-title{font-weight:700;font-size:14px}
.insight .i-body{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.insight.warn{border-color:rgba(250,178,25,.5)}
.insight.crit{border-color:rgba(208,59,59,.5)}
.insight.good{border-color:rgba(12,163,12,.45)}

.empty{
  text-align:center;color:var(--ink-3);padding:38px 16px;font-size:14px;
}
.empty .e-ico{font-size:34px;display:block;margin-bottom:8px}
footer.credit{color:var(--ink-3);font-size:12px;text-align:center;padding:26px 0 10px}

/* ---------- Product thumbnails ---------- */
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--grid);flex-shrink:0;display:block}
.thumb-fallback{width:36px;height:36px;border-radius:8px;background:var(--grid);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.prod-card .p-img{width:100%;height:64px;border-radius:8px;object-fit:cover;background:var(--grid);margin-bottom:4px;display:block}
.prod-card .p-img-fb{width:100%;height:64px;border-radius:8px;background:var(--grid);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:4px}
.img-preview{max-width:100%;max-height:120px;border-radius:10px;margin-top:6px;display:none}

/* ---------- AI chat ---------- */
.ai-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ai-ask{display:flex;gap:8px}
.ai-ask textarea{flex:1;min-height:44px;max-height:120px;resize:vertical;padding:10px 12px;border:1px solid var(--ring);border-radius:10px;background:var(--page);color:var(--ink-1)}
.ai-answer{margin-top:14px;padding:14px 16px;border:1px solid var(--ring);border-radius:12px;background:var(--page);font-size:14px;line-height:1.65;overflow-wrap:break-word}
.ai-answer h4{font-size:14.5px;margin:10px 0 4px}
.ai-answer ul,.ai-answer ol{margin:4px 0 8px 22px}
.ai-answer p{margin:6px 0}
.ai-q{font-size:12.5px;color:var(--ink-3);margin-top:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ring);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Shop layout (bird's eye view) ---------- */
.plan-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.plan-toolbar .pal{border:1px solid var(--ring);border-radius:10px;background:var(--surface-1);color:var(--ink-1);
  padding:7px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.plan-toolbar .pal:hover{border-color:var(--accent)}
.plan-wrap{overflow:auto;border:1px solid var(--ring);border-radius:12px;background:var(--surface-1);max-height:70vh}
.plan-grid{position:relative;touch-action:none;background-color:var(--page);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  box-shadow:inset 0 0 0 2px var(--axis)}
.fixture{position:absolute;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11px;line-height:1.15;color:#fff;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
  padding:2px;text-align:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.fixture .fx-ico{font-size:16px}
.fixture.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:5}
.fixture.dragging{opacity:.75;z-index:9;cursor:grabbing}
.fixture.bad{outline:3px solid var(--critical)}
.fx-dot{position:absolute;top:3px;right:3px;width:11px;height:11px;border-radius:50%;border:2px solid #fff}
.fx-dot.red{background:var(--critical)} .fx-dot.yellow{background:var(--warning)}
.plan-props{margin-top:12px}
.prod-check{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px;max-height:220px;overflow-y:auto;margin-top:8px}
.prod-check label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer}
.prod-check label:hover{background:var(--accent-soft)}
.prod-check input{width:auto}

/* ---------- Print report (PDF via print dialog) ---------- */
#printReport{display:none}
@media print{
  body{background:#fff}
  .app,.bottomnav,.topbar,footer.credit,#modalRoot{display:none!important}
  #printReport{display:block;color:#000;font-size:13px;padding:10px}
  #printReport h1{font-size:20px;margin-bottom:2px}
  #printReport .pr-sub{color:#555;margin-bottom:14px}
  #printReport .pr-tiles{display:flex;gap:14px;margin-bottom:16px}
  #printReport .pr-tile{border:1px solid #ccc;border-radius:8px;padding:10px 14px;flex:1}
  #printReport .pr-tile .v{font-size:18px;font-weight:700}
  #printReport table{width:100%;border-collapse:collapse;margin-bottom:16px}
  #printReport th,#printReport td{border:1px solid #ccc;padding:5px 8px;text-align:left}
  #printReport th{background:#f0f0f0}
  #printReport td.num,#printReport th.num{text-align:right}
  #printReport h2{font-size:15px;margin:14px 0 6px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">🏪</span><span id="brandName">ร้านค้าของเรา</span>
      <button class="theme-toggle" id="themeToggle" type="button" title="สลับโหมดมืด/สว่าง">🌙</button></div>
  </nav>
  <div style="flex:1;min-width:0">
    <div class="topbar"><span style="font-size:20px">🏪</span><span id="brandNameM">ร้านค้าของเรา</span>
      <button class="theme-toggle" id="themeToggleM" type="button" title="สลับโหมดมืด/สว่าง">🌙</button></div>
    <main class="main" id="main"></main>
    <footer class="credit">ข้อมูลทั้งหมดถูกเก็บไว้ในเครื่องนี้เท่านั้น — อย่าลืมสำรองข้อมูลเป็นประจำ (เมนู ตั้งค่า)</footer>
  </div>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<div id="modalRoot"></div>
<div id="printReport"></div>

<script>
"use strict";
/* =========================================================
   ระบบจัดการร้านค้า (Local Mart Manager)
   - เก็บข้อมูลใน localStorage ทั้งหมด ไม่ต้องใช้ server
   ========================================================= */

const LS_KEY = "lmm_data_v1";

const DEFAULT_DATA = {
  shop: { name: "ร้านค้าของเรา", minStockDefault: 5,
          ai: { apiKey: "", model: "meta-llama/llama-3.3-70b-instruct:free" } },
  products: [],      // {id,name,category,cost,price,stock,minStock,imageUrl,createdAt}
  movements: [],     // {id,productId,type:'in'|'out',qty,unit,total,profit,note,date,saleId}
  transactions: [],  // {id,type:'income'|'expense',category,amount,note,date,ref}
  employees: [],     // {id,name,role,phone,salary,startDate,active}
  payrolls: [],      // {id,employeeId,amount,date,note}
  layout: { cols: 16, rows: 10, items: [] } // items: {id,type,x,y,w,h,label,productIds:[]}
};

let db = load();
/* เติมค่าใหม่ให้ข้อมูลเก่าที่บันทึกไว้ก่อนมี field เหล่านี้ */
function normalizeData(d){
  const out = Object.assign(structuredClone(DEFAULT_DATA), d);
  out.shop = Object.assign(structuredClone(DEFAULT_DATA.shop), out.shop||{});
  out.shop.ai = Object.assign(structuredClone(DEFAULT_DATA.shop.ai), out.shop.ai||{});
  out.layout = Object.assign(structuredClone(DEFAULT_DATA.layout), out.layout||{});
  if(!Array.isArray(out.layout.items)) out.layout.items = [];
  return out;
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return structuredClone(DEFAULT_DATA);
    return normalizeData(JSON.parse(raw));
  }catch(e){ return structuredClone(DEFAULT_DATA); }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------- helpers ---------- */
const THB = n => { const v = Number(n||0); return (v<0?"−":"") + "฿" + Math.abs(v).toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2}); };
const NUM = n => Number(n||0).toLocaleString("th-TH");
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){
  if(!iso) return "-";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"});
}
function monthKey(iso){ return (iso||"").slice(0,7); }
function thisMonth(){ return todayISO().slice(0,7); }
function lastMonth(){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function monthName(mk){
  const [y,m]=mk.split("-");
  return new Date(y, m-1, 1).toLocaleDateString("th-TH",{month:"long",year:"numeric"});
}
function daysAgoISO(n){
  const d=new Date(); d.setDate(d.getDate()-n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const prodById = id => db.products.find(p=>p.id===id);
/* รูปสินค้าจากลิงก์ — โหลดไม่ได้/ไม่มีลิงก์ ให้แสดงกล่อง emoji แทน */
function safeImgUrl(u){
  u = String(u||"").trim();
  return /^(https?:|data:image\/)/i.test(u) ? u : "";
}
function prodThumb(p){
  const u = safeImgUrl(p.imageUrl);
  if(!u) return `<span class="thumb-fallback">📦</span>`;
  return `<img class="thumb" src="${esc(u)}" alt="" loading="lazy"
    onerror="this.outerHTML='<span class=&quot;thumb-fallback&quot;>📦</span>'">`;
}
function prodCardImg(p){
  const u = safeImgUrl(p.imageUrl);
  if(!u) return `<span class="p-img-fb">📦</span>`;
  return `<img class="p-img" src="${esc(u)}" alt="" loading="lazy"
    onerror="this.outerHTML='<span class=&quot;p-img-fb&quot;>📦</span>'">`;
}

/* ---------- aggregations ---------- */
function sumTx(type, from, to){
  return db.transactions.filter(t=>t.type===type && t.date>=from && t.date<=to)
    .reduce((s,t)=>s+t.amount,0);
}
function monthTx(type, mk){
  return db.transactions.filter(t=>t.type===type && monthKey(t.date)===mk)
    .reduce((s,t)=>s+t.amount,0);
}
/* ยอดของเดือนก่อน เฉพาะช่วงวันที่ 1 ถึงวันเดียวกับวันนี้ เพื่อเทียบแบบยุติธรรม */
function lastMonthSamePeriod(type){
  const day = String(new Date().getDate()).padStart(2,"0");
  return sumTx(type, lastMonth()+"-01", lastMonth()+"-"+day);
}
function salesQtyByProduct(from, to){
  const m = {};
  db.movements.forEach(mv=>{
    if(mv.type==="out" && mv.date>=from && mv.date<=to){
      m[mv.productId] = (m[mv.productId]||0) + mv.qty;
    }
  });
  return m;
}
function stockValue(){ return db.products.reduce((s,p)=>s+p.cost*p.stock,0); }
function lowStockList(){ return db.products.filter(p=>p.stock<=p.minStock); }

/* แจ้งเตือนสต็อกต่ำแบบรวมเป็นรายการเดียว + ปุ่มสั่งซื้อด่วนต่อรายการ (ใช้ในหน้าภาพรวม) */
function drawLowStock(box, onChange){
  const low = lowStockList().sort((a,b)=> a.stock - b.stock);
  if(!low.length){
    box.innerHTML = `<div class="empty"><span class="e-ico">✅</span>สต็อกทุกรายการยังเพียงพอ</div>`;
    return;
  }
  const outCount = low.filter(p=>p.stock===0).length;
  box.innerHTML = `
    <div class="small" style="padding:8px 10px;border-radius:8px;margin-bottom:10px;
      background:${outCount?'rgba(208,59,59,.12)':'rgba(250,178,25,.15)'};
      color:${outCount?'var(--critical)':'#a97400'}">
      ${outCount ? `มี ${NUM(outCount)} รายการสินค้าหมดแล้ว จากทั้งหมด ${NUM(low.length)} รายการที่ต้องเติมสต็อก`
                  : `มี ${NUM(low.length)} รายการที่เหลือน้อยกว่าจุดแจ้งเตือน — ควรเติมสต็อกเร็วๆ นี้`}
    </div>
    <div class="tbl-wrap" style="max-height:280px;overflow-y:auto"><table>
      ${low.map(p=>`<tr>
        <td>${esc(p.name)}</td>
        <td class="num">${p.stock===0?`<span class="badge out">หมด</span>`:`<span class="badge low">เหลือ ${NUM(p.stock)}</span>`}</td>
        <td class="num"><button class="btn secondary sm qo-btn" data-id="${p.id}">📥 สั่งซื้อด่วน</button></td>
      </tr>`).join("")}
    </table></div>`;
  box.querySelectorAll(".qo-btn").forEach(b=>{
    b.onclick = ()=>{ stockInModal(prodById(b.dataset.id), onChange); };
  });
}

let currentPage = "dash";

function buildNav(){
  const sb = document.getElementById("sidebar");
  sb.querySelectorAll(".nav-btn").forEach(b=>b.remove());
  PAGES.forEach(p=>{
    const b = document.createElement("button");
    b.className = "nav-btn"+(p.id===currentPage?" active":"");
    b.innerHTML = `<span class="ico">${p.ico}</span>${p.label}`;
    b.onclick = ()=>go(p.id);
    sb.appendChild(b);
  });
  const bn = document.getElementById("bottomnav");
  bn.innerHTML = "";
  const mobilePages = PAGES.filter(p=>p.nav).concat(PAGES.find(p=>p.id==="set"));
  mobilePages.forEach(p=>{
    const b = document.createElement("button");
    b.className = p.id===currentPage?"active":"";
    b.innerHTML = `<span class="ico">${p.ico}</span>${p.short}`;
    b.onclick = ()=>go(p.id);
    bn.appendChild(b);
  });
}
function go(id){
  currentPage = id;
  buildNav();
  const page = PAGES.find(p=>p.id===id);
  document.getElementById("main").innerHTML = "";
  page.render(document.getElementById("main"));
  window.scrollTo(0,0);
}

/* =========================================================

   ========================================================= */
function openModal(title, bodyHTML, onSubmit, submitLabel="บันทึก"){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-back" id="mBack">
      <div class="modal">
        <h3>${title}</h3>
        <form id="mForm">${bodyHTML}
          <div class="modal-actions">
            <button type="button" class="btn secondary" id="mCancel">ยกเลิก</button>
            <button type="submit" class="btn">${submitLabel}</button>
          </div>
        </form>
      </div>
    </div>`;
  const close = ()=>{ root.innerHTML=""; };
  root.querySelector("#mCancel").onclick = close;
  root.querySelector("#mBack").onclick = e=>{ if(e.target.id==="mBack") close(); };
  root.querySelector("#mForm").onsubmit = e=>{
    e.preventDefault();
    const fd = {};
    root.querySelectorAll("#mForm [name]").forEach(el=>{
      fd[el.name] = el.type==="checkbox" ? el.checked : el.value;
    });
    if(onSubmit(fd)!==false) close();
  };
  const first = root.querySelector("#mForm input,#mForm select");
  if(first) first.focus();
}
function confirmBox(msg, onYes){
  openModal("ยืนยัน", `<p style="font-size:14px;color:var(--ink-2)">${msg}</p>`, ()=>{ onYes(); }, "ยืนยัน");
}

/* =========================================================
   Charts (SVG, no libs)
   ========================================================= */
function groupedBarChart(el, days){
  // days: [{label, dateISO, income, expense}]
  const W=640, H=230, padL=48, padR=8, padT=10, padB=26;
  const iw = W-padL-padR, ih = H-padT-padB;
  const maxV = Math.max(100, ...days.map(d=>Math.max(d.income,d.expense)));
  const niceMax = niceCeil(maxV);
  const n = days.length;
  const slot = iw/n;
  const barW = Math.min(12, slot*0.28);
  let bars="", labels="", grid="";
  // gridlines: 4 steps
  for(let i=0;i<=4;i++){
    const v = niceMax*i/4;
    const y = padT + ih - ih*i/4;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${padL-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${compactNum(v)}</text>`;
  }
  days.forEach((d,i)=>{
    const cx = padL + slot*i + slot/2;
    const hInc = ih * d.income/niceMax;
    const hExp = ih * d.expense/niceMax;
    bars += barRect(cx-barW-1, padT+ih-hInc, barW, hInc, "var(--income)");
    bars += barRect(cx+1, padT+ih-hExp, barW, hExp, "var(--expense)");
    if(i%2===0 || n<=8)
      labels += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${d.label}</text>`;
  });
  el.innerHTML = `
    <div class="legend">
      <span><span class="sw" style="background:var(--income)"></span>รายรับ</span>
      <span><span class="sw" style="background:var(--expense)"></span>รายจ่าย</span>
    </div>
    <div class="chart-box">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟรายรับรายจ่ายรายวัน">
        ${grid}
        <line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="var(--axis)" stroke-width="1"/>
        ${bars}
        ${days.map((d,i)=>{
          const x = padL + slot*i;
          return `<rect data-i="${i}" x="${x}" y="${padT}" width="${slot}" height="${ih}" fill="transparent"/>`;
        }).join("")}
      </svg>
      <div class="tooltip" id="ttBar"></div>
    </div>`;
  const tt = el.querySelector("#ttBar");
  const box = el.querySelector(".chart-box");
  el.querySelectorAll("rect[data-i]").forEach(r=>{
    r.addEventListener("mousemove", e=>{
      const d = days[+r.dataset.i];
      tt.innerHTML = `${fmtDate(d.dateISO)}<br>รายรับ <b>${THB(d.income)}</b><br>รายจ่าย <b>${THB(d.expense)}</b>`;
      tt.style.opacity = 1;
      const bb = box.getBoundingClientRect();
      let x = e.clientX-bb.left+12, y = e.clientY-bb.top-10;
      if(x+150>bb.width) x -= 165;
      tt.style.left = x+"px"; tt.style.top = y+"px";
    });
    r.addEventListener("mouseleave", ()=>{ tt.style.opacity=0; });
  });
}
function barRect(x,y,w,h,fill){
  if(h<=0) return "";
  const r = Math.min(4, h);
  return `<path d="M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z" fill="${fill}"/>`;
}
function hBarList(el, items, color){
  // items: [{name, value, sub}]
  if(!items.length){ el.innerHTML = `<div class="empty"><span class="e-ico">📭</span>ยังไม่มีข้อมูล</div>`; return; }
  const max = Math.max(...items.map(i=>i.value), 1);
  el.innerHTML = items.map(i=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
        <span>${esc(i.name)}</span>
        <span style="font-variant-numeric:tabular-nums;font-weight:600">${i.sub}</span>
      </div>
      <div style="height:8px;background:var(--grid);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${Math.max(2,i.value/max*100)}%;background:${color};border-radius:4px"></div>
      </div>
    </div>`).join("");
}
function niceCeil(v){
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v/p;
  const nf = f<=1?1 : f<=2?2 : f<=5?5 : 10;
  return nf*p;
}
function compactNum(v){
  if(v>=1e6) return (v/1e6).toLocaleString("th-TH",{maximumFractionDigits:1})+"M";
  if(v>=1e3) return (v/1e3).toLocaleString("th-TH",{maximumFractionDigits:1})+"k";
  return NUM(v);
}

/* =========================================================
   ส่งออกข้อมูล (CSV / PDF / PNG) — ไม่ใช้ library ภายนอก
   ========================================================= */
function downloadBlob(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function downloadCSV(filename, rows){
  const escCell = v => {
    v = String(v??"");
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  };
  // BOM เพื่อให้ Excel เปิดภาษาไทยไม่เพี้ยน
  const csv = "﻿" + rows.map(r=>r.map(escCell).join(",")).join("\r\n");
  downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}), filename);
}
function exportTxCSV(mk){
  const list = db.transactions.filter(t=>monthKey(t.date)===mk)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const rows = [["วันที่","ประเภท","หมวดหมู่","รายละเอียด","จำนวนเงิน(บาท)"]];
  list.forEach(t=>rows.push([t.date, t.type==="income"?"รายรับ":"รายจ่าย", t.category, t.note||"", t.type==="income"?t.amount:-t.amount]));
  const inc = monthTx("income",mk), exp = monthTx("expense",mk);
  rows.push([],["รวมรายรับ","","","",inc],["รวมรายจ่าย","","","",-exp],["คงเหลือ(กำไร)","","","",inc-exp]);
  downloadCSV(`รายรับรายจ่าย-${mk}.csv`, rows);
}
function exportProductsCSV(){
  const rows = [["ชื่อสินค้า","หมวดหมู่","ราคาทุน","ราคาขาย","คงเหลือ","จุดแจ้งเตือน","มูลค่าสต็อก(ทุน)","ลิงก์รูป"]];
  db.products.forEach(p=>rows.push([p.name,p.category||"",p.cost,p.price,p.stock,p.minStock,p.cost*p.stock,p.imageUrl||""]));
  downloadCSV(`รายการสินค้า-${todayISO()}.csv`, rows);
}
/* ส่งออกประวัติเข้าออก พร้อมตัวกรอง (สินค้า/ประเภท/ช่วงวันที่) และรวมยอดท้ายไฟล์ */
function exportMovementsCSV(filter={}){
  const {productId="", type="", from="", to=""} = filter;
  const list = db.movements
    .filter(m=> !productId || m.productId===productId)
    .filter(m=> !type || m.type===type)
    .filter(m=> !from || m.date>=from)
    .filter(m=> !to || m.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const hasProfit = list.some(m=>m.type==="out");
  const header = ["วันที่","สินค้า","ประเภท","จำนวน","ราคาต่อหน่วย","มูลค่ารวม"];
  if(hasProfit) header.push("กำไร");
  header.push("หมายเหตุ");
  const rows = [header];
  let qtyIn=0, qtyOut=0, totIn=0, totOut=0, profitSum=0;
  list.forEach(m=>{
    const p = prodById(m.productId);
    const row = [m.date, p?p.name:"(ลบแล้ว)", m.type==="in"?"รับเข้า":"ขายออก", m.qty, m.unit, m.total];
    if(hasProfit) row.push(m.type==="out" ? (m.profit??"") : "");
    row.push(m.note||"");
    rows.push(row);
    if(m.type==="in"){ qtyIn+=m.qty; totIn+=m.total; } else { qtyOut+=m.qty; totOut+=m.total; profitSum+=m.profit||0; }
  });
  rows.push([]);
  rows.push(["สรุป","","จำนวนรายการ",list.length]);
  rows.push(["","รับเข้า","รวมจำนวน",qtyIn,"รวมมูลค่า",totIn]);
  rows.push(["","ขายออก","รวมจำนวน",qtyOut,"รวมมูลค่า",totOut, hasProfit?"รวมกำไร":"", hasProfit?profitSum:""]);
  const p = productId ? prodById(productId) : null;
  const nameTag = p ? `-${p.name}` : "";
  const rangeTag = (from||to) ? `_${from||"เริ่ม"}_ถึง_${to||"ล่าสุด"}` : "";
  downloadCSV(`ประวัติเข้าออก${nameTag}${rangeTag}-${todayISO()}.csv`, rows);
}

function buildMonthlyReport(mk){
  const income = monthTx("income", mk), expense = monthTx("expense", mk);
  const txs = db.transactions.filter(t=>monthKey(t.date)===mk)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const q = salesQtyByProduct(mk+"-01", mk+"-31");
  const top = Object.entries(q).map(([pid,qty])=>({p:prodById(pid),qty})).filter(x=>x.p)
    .sort((a,b)=>b.qty-a.qty).slice(0,8);
  const byCat = {};
  txs.filter(t=>t.type==="expense").forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  return { mk, income, expense, profit: income-expense, txs, top,
    expCats: Object.entries(byCat).sort((a,b)=>b[1]-a[1]) };
}

function exportMonthPNG(mk){
  const r = buildMonthlyReport(mk);
  const W = 900, rowH = 34;
  const H = 320 + Math.max(r.top.length, 1)*rowH + 90 + Math.max(r.expCats.length,1)*rowH + 60;
  const cv = document.createElement("canvas");
  cv.width = W*2; cv.height = H*2;                 // วาด 2x ให้คมชัด
  const ctx = cv.getContext("2d");
  ctx.scale(2,2);
  const font = s => `${s} system-ui, 'Noto Sans Thai', sans-serif`;
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#0b0b0b"; ctx.font = font("bold 26px");
  ctx.fillText(`${db.shop.name} — รายงานเดือน ${monthName(mk)}`, 30, 48);
  ctx.fillStyle = "#777"; ctx.font = font("14px");
  ctx.fillText(`จัดทำเมื่อ ${fmtDate(todayISO())}`, 30, 72);
  // tiles
  const tiles = [["รายรับ",THB(r.income),"#2a78d6"],["รายจ่าย",THB(r.expense),"#e34948"],["กำไร",THB(r.profit),r.profit>=0?"#006300":"#d03b3b"]];
  tiles.forEach((t,i)=>{
    const x = 30 + i*285;
    ctx.strokeStyle = "#ddd"; ctx.strokeRect(x, 95, 260, 80);
    ctx.fillStyle = "#777"; ctx.font = font("14px"); ctx.fillText(t[0], x+16, 122);
    ctx.fillStyle = t[2]; ctx.font = font("bold 26px"); ctx.fillText(t[1], x+16, 158);
  });
  // top products bars
  let y = 225;
  ctx.fillStyle = "#0b0b0b"; ctx.font = font("bold 17px"); ctx.fillText("สินค้าขายดี", 30, y); y += 16;
  const maxQ = Math.max(...r.top.map(x=>x.qty), 1);
  if(!r.top.length){ ctx.fillStyle="#999"; ctx.font=font("14px"); ctx.fillText("ไม่มีข้อมูล", 30, y+20); y += rowH; }
  r.top.forEach(x=>{
    ctx.fillStyle = "#0b0b0b"; ctx.font = font("14px");
    ctx.fillText(x.p.name.slice(0,28), 30, y+16);
    ctx.fillStyle = "#e8e8e8"; ctx.fillRect(300, y+4, 440, 16);
    ctx.fillStyle = "#2a78d6"; ctx.fillRect(300, y+4, Math.max(6, x.qty/maxQ*440), 16);
    ctx.fillStyle = "#0b0b0b"; ctx.fillText(NUM(x.qty)+" ชิ้น", 755, y+17);
    y += rowH;
  });
  // expenses by category
  y += 40;
  ctx.fillStyle = "#0b0b0b"; ctx.font = font("bold 17px"); ctx.fillText("รายจ่ายตามหมวด", 30, y); y += 16;
  const maxE = Math.max(...r.expCats.map(x=>x[1]), 1);
  if(!r.expCats.length){ ctx.fillStyle="#999"; ctx.font=font("14px"); ctx.fillText("ไม่มีข้อมูล", 30, y+20); y += rowH; }
  r.expCats.forEach(([c,v])=>{
    ctx.fillStyle = "#0b0b0b"; ctx.font = font("14px");
    ctx.fillText(c.slice(0,28), 30, y+16);
    ctx.fillStyle = "#e8e8e8"; ctx.fillRect(300, y+4, 440, 16);
    ctx.fillStyle = "#e34948"; ctx.fillRect(300, y+4, Math.max(6, v/maxE*440), 16);
    ctx.fillStyle = "#0b0b0b"; ctx.fillText(THB(v), 755, y+17);
    y += rowH;
  });
  cv.toBlob(b=>downloadBlob(b, `รายงาน-${mk}.png`), "image/png");
}

/* =========================================================
   หน้า: ภาพรวม (Dashboard)
   ========================================================= */
function renderDash(el){
  const today = todayISO(), mk = thisMonth();
  const incToday  = sumTx("income", today, today);
  const incMonth  = monthTx("income", mk);
  const expMonth  = monthTx("expense", mk);
  const profit    = incMonth - expMonth;
  const incLast   = lastMonthSamePeriod("income");
  const trend     = incLast>0 ? ((incMonth-incLast)/incLast*100) : null;
  const low       = lowStockList();

  el.innerHTML = `
    <div class="page-title">ภาพรวมร้าน</div>
    <div class="page-sub">${new Date().toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
    <div class="grid-tiles">
      <div class="tile"><div class="t-label">ยอดขายวันนี้</div><div class="t-value">${THB(incToday)}</div></div>
      <div class="tile"><div class="t-label">รายรับเดือนนี้</div><div class="t-value">${THB(incMonth)}</div>
        ${trend!==null?`<div class="t-delta ${trend>=0?'up':'down'}">${trend>=0?"▲":"▼"} ${Math.abs(trend).toFixed(1)}% จากเดือนก่อน</div>`:""}
      </div>
      <div class="tile"><div class="t-label">รายจ่ายเดือนนี้</div><div class="t-value">${THB(expMonth)}</div></div>
      <div class="tile"><div class="t-label">กำไรเดือนนี้</div>
        <div class="t-value" style="color:${profit>=0?'var(--good-text)':'var(--critical)'}">${THB(profit)}</div></div>
      <div class="tile"><div class="t-label">มูลค่าสต็อก (ทุน)</div><div class="t-value">${THB(stockValue())}</div>
        <div class="t-delta">${NUM(db.products.length)} รายการสินค้า</div></div>
    </div>

    <div class="card">
      <h3>รายรับ-รายจ่าย 14 วันล่าสุด</h3>
      <div id="chartMain"></div>
    </div>

    <div class="two-col" style="margin-top:16px">
      <div class="card" style="margin-top:0">
        <h3>สินค้าขายดี เดือนนี้</h3>
        <div id="topProducts"></div>
      </div>
      <div class="card" style="margin-top:0">
        <h3>⚠️ สินค้าใกล้หมด (${low.length})</h3>
        <div id="lowStock"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h3>รายการล่าสุด</h3>
      <div id="recentTx"></div>
    </div>`;

  // chart data: last 14 days
  const days = [];
  for(let i=13;i>=0;i--){
    const iso = daysAgoISO(i);
    days.push({
      dateISO: iso,
      label: new Date(iso+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short"}),
      income: sumTx("income", iso, iso),
      expense: sumTx("expense", iso, iso)
    });
  }
  groupedBarChart(el.querySelector("#chartMain"), days);

  // top products this month
  const q = salesQtyByProduct(mk+"-01", mk+"-31");
  const top = Object.entries(q).map(([pid,qty])=>({p:prodById(pid),qty}))
    .filter(x=>x.p).sort((a,b)=>b.qty-a.qty).slice(0,5)
    .map(x=>({name:x.p.name, value:x.qty, sub:NUM(x.qty)+" ชิ้น"}));
  hBarList(el.querySelector("#topProducts"), top, "var(--seq)");

  // low stock — สรุปรวมเป็นรายการเดียว พร้อมปุ่มสั่งซื้อด่วนต่อรายการ
  drawLowStock(el.querySelector("#lowStock"), () => renderDash(el));

  // recent transactions
  const recent = [...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,8);
  const rEl = el.querySelector("#recentTx");
  if(!recent.length){
    rEl.innerHTML = `<div class="empty"><span class="e-ico">🧾</span>ยังไม่มีรายการ — เริ่มจากเพิ่มสินค้าที่หน้า "สินค้า & สต็อก" แล้วลองขายดู</div>`;
  }else{
    rEl.innerHTML = `<div class="tbl-wrap"><table>
      <tr><th>วันที่</th><th>รายการ</th><th>ประเภท</th><th class="num">จำนวนเงิน</th></tr>
      ${recent.map(t=>`<tr>
        <td class="small muted">${fmtDate(t.date)}</td>
        <td>${esc(t.note||t.category)}</td>
        <td><span class="badge ${t.type==="income"?"in":"exp"}">${t.type==="income"?"รายรับ":"รายจ่าย"}</span></td>
        <td class="num" style="font-weight:600;color:${t.type==="income"?"var(--good-text)":"var(--critical)"}">
          ${t.type==="income"?"+":"−"}${THB(t.amount)}</td>
      </tr>`).join("")}
    </table></div>`;
  }
}

/* =========================================================
   หน้า: ขายสินค้า (POS)
   ========================================================= */
let cart = []; // {productId, qty, price}
function renderSale(el){
  el.innerHTML = `
    <div class="page-title">ขายสินค้า</div>
    <div class="page-sub">แตะสินค้าเพื่อเพิ่มลงตะกร้า แล้วกดบันทึกการขาย — สต็อกและรายรับจะถูกบันทึกอัตโนมัติ</div>
    <div class="pos-grid">
      <div class="card" style="margin-top:0">
        <div class="toolbar" style="margin-bottom:10px">
          <input type="search" id="posSearch" placeholder="🔍 ค้นหาสินค้า...">
        </div>
        <div class="prod-pick" id="prodPick"></div>
      </div>
      <div class="card" style="margin-top:0">
        <h3>🧺 ตะกร้า</h3>
        <div id="cartBox"></div>
      </div>
    </div>`;
  const drawProducts = (filter="")=>{
    const list = db.products
      .filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()) || (p.category||"").toLowerCase().includes(filter.toLowerCase()));
    const pick = el.querySelector("#prodPick");
    if(!db.products.length){
      pick.innerHTML = `<div class="empty" style="grid-column:1/-1"><span class="e-ico">📦</span>ยังไม่มีสินค้า<br><button class="btn sm" style="margin-top:10px" onclick="go('stock')">+ เพิ่มสินค้าก่อน</button></div>`;
      return;
    }
    pick.innerHTML = list.map(p=>`
      <button class="prod-card" data-id="${p.id}" ${p.stock<=0?"disabled":""}>
        ${prodCardImg(p)}
        <span class="p-name">${esc(p.name)}</span>
        <span class="p-price">${THB(p.price)}</span>
        <span class="p-stock">${p.stock<=0?"สินค้าหมด":"คงเหลือ "+NUM(p.stock)}</span>
      </button>`).join("") || `<div class="empty" style="grid-column:1/-1">ไม่พบสินค้า</div>`;
    pick.querySelectorAll(".prod-card").forEach(b=>{
      b.onclick = ()=>{ addToCart(b.dataset.id); drawCart(); };
    });
  };
  const addToCart = pid=>{
    const p = prodById(pid);
    const line = cart.find(c=>c.productId===pid);
    const inCart = line?line.qty:0;
    if(inCart >= p.stock){ return; }
    if(line) line.qty++;
    else cart.push({productId:pid, qty:1, price:p.price});
  };
  const drawCart = ()=>{
    const box = el.querySelector("#cartBox");
    if(!cart.length){
      box.innerHTML = `<div class="empty"><span class="e-ico">🧺</span>ตะกร้าว่าง — แตะสินค้าด้านซ้ายเพื่อเพิ่ม</div>`;
      return;
    }
    const total = cart.reduce((s,c)=>s+c.qty*c.price,0);
    box.innerHTML = cart.map((c,i)=>{
      const p = prodById(c.productId);
      return `<div class="cart-line">
        <span class="c-name">${esc(p.name)}<br><span class="small muted">${THB(c.price)} / ชิ้น</span></span>
        <span class="qty-ctl">
          <button data-a="dec" data-i="${i}">−</button><span>${c.qty}</span><button data-a="inc" data-i="${i}">+</button>
        </span>
        <span style="width:80px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${THB(c.qty*c.price)}</span>
        <button class="btn ghost sm" data-a="rm" data-i="${i}">✕</button>
      </div>`;
    }).join("") + `
      <div class="cart-total"><span>รวมทั้งหมด</span><span>${THB(total)}</span></div>
      <button class="btn" id="checkout" style="width:100%;justify-content:center;padding:12px;font-size:16px">💵 บันทึกการขาย</button>
      <button class="btn secondary sm" id="clearCart" style="width:100%;justify-content:center;margin-top:8px">ล้างตะกร้า</button>`;
    box.querySelectorAll("[data-a]").forEach(b=>{
      b.onclick = ()=>{
        const i = +b.dataset.i, c = cart[i], p = prodById(c.productId);
        if(b.dataset.a==="inc" && c.qty < p.stock) c.qty++;
        if(b.dataset.a==="dec"){ c.qty--; if(c.qty<=0) cart.splice(i,1); }
        if(b.dataset.a==="rm") cart.splice(i,1);
        drawCart();
      };
    });
    const co = box.querySelector("#checkout");
    if(co) co.onclick = checkout;
    const cc = box.querySelector("#clearCart");
    if(cc) cc.onclick = ()=>{ cart=[]; drawCart(); };
  };
  const checkout = ()=>{
    if(!cart.length) return;
    const date = todayISO();
    const saleId = uid();
    let total=0, profit=0, items=[];
    cart.forEach(c=>{
      const p = prodById(c.productId);
      const qty = Math.min(c.qty, p.stock);
      if(qty<=0) return;
      p.stock -= qty;
      const lineTotal = qty*c.price;
      const lineProfit = qty*(c.price-p.cost);
      total += lineTotal; profit += lineProfit;
      items.push(p.name+"×"+qty);
      db.movements.push({id:uid(), productId:p.id, type:"out", qty, unit:c.price, total:lineTotal, profit:lineProfit, note:"ขายหน้าร้าน", date, saleId});
    });
    if(total>0){
      db.transactions.push({id:uid(), type:"income", category:"ขายสินค้า", amount:total, note:"ขาย: "+items.join(", "), date, ref:saleId});
      save();
    }
    cart = [];
    drawProducts(el.querySelector("#posSearch").value);
    drawCart();
    const box = el.querySelector("#cartBox");
    box.insertAdjacentHTML("afterbegin",
      `<div class="insight good" style="margin-bottom:12px"><span class="i-ico">✅</span>
       <div><div class="i-title">บันทึกการขายแล้ว ${THB(total)}</div>
       <div class="i-body">กำไรขั้นต้นจากบิลนี้ ${THB(profit)}</div></div></div>`);
  };
  el.querySelector("#posSearch").oninput = e=>drawProducts(e.target.value);
  drawProducts(); drawCart();
}

function renderStock(el){
  el.innerHTML = `
    <div class="page-title">สินค้า & สต็อก</div>
    <div class="page-sub">เพิ่มสินค้า รับของเข้า และติดตามจำนวนคงเหลือ</div>
    <div class="toolbar">
      <input type="search" id="stSearch" placeholder="🔍 ค้นหาสินค้า...">
      <button class="btn" id="addProd">+ เพิ่มสินค้า</button>
    </div>
    <div class="card" style="margin-top:0"><div class="tbl-wrap" id="prodTable"></div>
      <div style="margin-top:12px"><button class="btn secondary sm" id="expProdCsv">📑 ส่งออกรายการสินค้า (CSV)</button></div>
    </div>
    <div class="card"><h3>ประวัติรับเข้า-ขายออก ล่าสุด</h3><div class="tbl-wrap" id="mvTable"></div>
      <div style="margin-top:12px"><button class="btn secondary sm" id="expMvCsv">📑 ส่งออกประวัติเข้าออก (CSV)...</button></div>
    </div>`;

  const draw = (filter="")=>{
    const list = db.products.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()) || (p.category||"").toLowerCase().includes(filter.toLowerCase()));
    const t = el.querySelector("#prodTable");
    if(!db.products.length){
      t.innerHTML = `<div class="empty"><span class="e-ico">📦</span>ยังไม่มีสินค้า — กด "+ เพิ่มสินค้า" เพื่อเริ่มต้น</div>`;
      return;
    }
    t.innerHTML = `<table>
      <tr><th>สินค้า</th><th>หมวดหมู่</th><th class="num">ทุน/ชิ้น</th><th class="num">ราคาขาย</th><th class="num">คงเหลือ</th><th>สถานะ</th><th></th></tr>
      ${list.map(p=>{
        const st = p.stock===0?`<span class="badge out">หมด</span>`
                 : p.stock<=p.minStock?`<span class="badge low">ใกล้หมด</span>`
                 : `<span class="badge ok">ปกติ</span>`;
        return `<tr>
          <td style="font-weight:600"><span style="display:flex;align-items:center;gap:9px">${prodThumb(p)}${esc(p.name)}</span></td>
          <td class="small muted">${esc(p.category||"-")}</td>
          <td class="num">${THB(p.cost)}</td>
          <td class="num">${THB(p.price)}</td>
          <td class="num" style="font-weight:600">${NUM(p.stock)}</td>
          <td>${st}</td>
          <td style="white-space:nowrap;text-align:right">
            <button class="btn sm secondary" data-a="in" data-id="${p.id}">📥 รับเข้า</button>
            <button class="btn ghost sm" data-a="edit" data-id="${p.id}">แก้ไข</button>
            <button class="btn ghost sm" data-a="del" data-id="${p.id}" style="color:var(--critical)">ลบ</button>
          </td></tr>`;
      }).join("")}
    </table>`;
    t.querySelectorAll("[data-a]").forEach(b=>{
      const p = prodById(b.dataset.id);
      if(b.dataset.a==="in") b.onclick = ()=>stockInModal(p, ()=>draw(el.querySelector("#stSearch").value));
      if(b.dataset.a==="edit") b.onclick = ()=>productModal(p, ()=>draw(el.querySelector("#stSearch").value));
      if(b.dataset.a==="del") b.onclick = ()=>confirmBox(`ลบสินค้า "${esc(p.name)}" ? ประวัติการขายเดิมจะยังอยู่`, ()=>{
        db.products = db.products.filter(x=>x.id!==p.id); save(); draw();
      });
    });
  };
  const drawMv = ()=>{
    const mv = [...db.movements].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,15);
    const t = el.querySelector("#mvTable");
    if(!mv.length){ t.innerHTML = `<div class="empty"><span class="e-ico">🔄</span>ยังไม่มีประวัติ</div>`; return; }
    t.innerHTML = `<table>
      <tr><th>วันที่</th><th>สินค้า</th><th>ประเภท</th><th class="num">จำนวน</th><th class="num">มูลค่า</th></tr>
      ${mv.map(m=>{
        const p = prodById(m.productId);
        return `<tr>
          <td class="small muted">${fmtDate(m.date)}</td>
          <td>${esc(p?p.name:"(ลบแล้ว)")}</td>
          <td><span class="badge ${m.type==="in"?"in":"exp"}">${m.type==="in"?"📥 รับเข้า":"📤 ขายออก"}</span></td>
          <td class="num">${NUM(m.qty)}</td>
          <td class="num">${THB(m.total)}</td></tr>`;
      }).join("")}
    </table>`;
  };
  el.querySelector("#addProd").onclick = ()=>productModal(null, ()=>{draw(); drawMv();});
  el.querySelector("#stSearch").oninput = e=>draw(e.target.value);
  el.querySelector("#expProdCsv").onclick = exportProductsCSV;
  el.querySelector("#expMvCsv").onclick = exportMovementsModal;
  draw(); drawMv();
}

function productModal(p, done){
  openModal(p?"แก้ไขสินค้า":"เพิ่มสินค้าใหม่", `
    <div class="field"><label>ชื่อสินค้า *</label><input name="name" required value="${p?esc(p.name):""}" placeholder="เช่น น้ำดื่ม 600ml"></div>
    <div class="field"><label>หมวดหมู่</label><input name="category" value="${p?esc(p.category||""):""}" placeholder="เช่น เครื่องดื่ม, ขนม, ของใช้"></div>
    <div class="form-row">
      <div class="field"><label>ราคาทุน/ชิ้น (บาท) *</label><input name="cost" type="number" min="0" step="0.01" required value="${p?p.cost:""}"></div>
      <div class="field"><label>ราคาขาย/ชิ้น (บาท) *</label><input name="price" type="number" min="0" step="0.01" required value="${p?p.price:""}"></div>
    </div>
    <div class="form-row">
      <div class="field"><label>จำนวนคงเหลือ</label><input name="stock" type="number" min="0" step="1" value="${p?p.stock:0}" ${p?"disabled":""}></div>
      <div class="field"><label>แจ้งเตือนเมื่อต่ำกว่า</label><input name="minStock" type="number" min="0" step="1" value="${p?p.minStock:db.shop.minStockDefault}"></div>
    </div>
    <div class="field"><label>ลิงก์รูปภาพสินค้า (ไม่บังคับ)</label>
      <input name="imageUrl" id="pImgUrl" value="${p?esc(p.imageUrl||""):""}" placeholder="วางลิงก์รูปจากเน็ต เช่น https://...jpg">
      <img id="pImgPrev" class="img-preview" alt="">
      <div class="small muted" style="margin-top:4px">คัดลอกลิงก์รูปจากเว็บ (คลิกขวา/กดค้างที่รูป → คัดลอกที่อยู่รูปภาพ) — รูปจะแสดงเมื่อมีอินเทอร์เน็ต</div>
    </div>
    ${p?`<div class="small muted">* แก้จำนวนคงเหลือผ่านปุ่ม "รับเข้า" หรือการขาย เพื่อให้ประวัติถูกต้อง</div>`:""}`,
    fd=>{
      if(p){
        Object.assign(p,{name:fd.name.trim(),category:fd.category.trim(),cost:+fd.cost,price:+fd.price,minStock:+fd.minStock||0,imageUrl:fd.imageUrl.trim()});
      }else{
        db.products.push({id:uid(),name:fd.name.trim(),category:fd.category.trim(),cost:+fd.cost,price:+fd.price,
          stock:+fd.stock||0,minStock:+fd.minStock||0,imageUrl:fd.imageUrl.trim(),createdAt:todayISO()});
      }
      save(); done();

function buildShopSummary(){
  const today = todayISO();
  const months = [];
  for(let i=2;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const mk = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    months.push({เดือน:mk, รายรับ:monthTx("income",mk), รายจ่าย:monthTx("expense",mk)});
  }
  const from90 = daysAgoISO(90);
  const q90 = salesQtyByProduct(from90, today);
  const products = [...db.products]
    .map(p=>({ชื่อ:p.name, หมวด:p.category||"", ทุน:p.cost, ราคาขาย:p.price, คงเหลือ:p.stock,
      จุดเตือน:p.minStock, ขาย90วัน:q90[p.id]||0}))
    .sort((a,b)=>b["ขาย90วัน"]-a["ขาย90วัน"]).slice(0,60);
  const expCats = {};
  db.transactions.filter(t=>t.type==="expense"&&t.date>=daysAgoISO(60))
    .forEach(t=>{ expCats[t.category]=(expCats[t.category]||0)+t.amount; });
  const dayNames = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
  const byDay = {};
  db.transactions.filter(t=>t.type==="income"&&t.date>=daysAgoISO(60)).forEach(t=>{
    const n = dayNames[new Date(t.date+"T00:00:00").getDay()];
    byDay[n] = (byDay[n]||0)+t.amount;
  });
  return JSON.stringify({
    ชื่อร้าน: db.shop.name, วันที่วันนี้: today,
    สรุปรายเดือน: months,
    สินค้า_เรียงตามขายดี: products,
    รายจ่ายตามหมวด_60วัน: expCats,
    ยอดขายแยกวันในสัปดาห์_60วัน: byDay,
    จำนวนพนักงาน: db.employees.length
  });
}

async function askAI(question){
  const {apiKey, model} = db.shop.ai;
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer "+apiKey,
      "Content-Type": "application/json",
      "X-Title": "Local Mart Manager"
    },
    signal: AbortSignal.timeout(90000),
    body: JSON.stringify({
      model,
      messages: [
        {role:"system", content:
`คุณคือที่ปรึกษาธุรกิจร้านขายของชำ/ร้านโชห่วยขนาดเล็กในไทย ผู้ใช้เป็นเจ้าของร้านเล็กๆ ที่ให้ญาติช่วยเฝ้าร้าน
ตอบเป็นภาษาไทยที่เข้าใจง่าย ใช้ข้อมูลจริงของร้าน (JSON ด้านล่าง) อ้างอิงตัวเลขจริงเสมอ ให้คำแนะนำที่ทำได้จริงกับร้านเล็ก งบน้อย
จัดรูปแบบ: หัวข้อสั้นๆ + bullet points กระชับ ไม่เกิน ~400 คำ

ข้อมูลร้าน:
${buildShopSummary()}`},
        {role:"user", content: question}
      ]
    })
  });
  if(!res.ok){
    let msg = "";
    try{ msg = (await res.json()).error?.message || ""; }catch(e){}
    if(res.status===401) throw new Error("API key ไม่ถูกต้อง — ตรวจสอบที่หน้า ตั้งค่า");
    if(res.status===402) throw new Error("เครดิต OpenRouter หมด — เติมเครดิตหรือเปลี่ยนเป็นโมเดลฟรี (:free)");
    if(res.status===429) throw new Error("เรียกใช้ถี่เกินไป/โมเดลฟรีคิวเต็ม — รอสักครู่แล้วลองใหม่");
    throw new Error(`เกิดข้อผิดพลาด (${res.status}) ${msg}`);
  }
  const data = await res.json();
  const content = data.choices?.[0]?.message?.content;
  if(!content) throw new Error("AI ไม่ตอบกลับ — ลองใหม่หรือเปลี่ยนโมเดล");
  return content;
}

/* แปลง markdown อย่างง่ายเป็น HTML (escape ก่อนเสมอ) */
function mdToHtml(md){
  const lines = esc(md).split("\n");
  let html = "", inList = false;
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`(.+?)`/g, "<code>$1</code>");
  for(let ln of lines){
    const t = ln.trim();
    const bullet = t.match(/^[-*•] +(.*)/) || t.match(/^\d+[.)] +(.*)/);
    if(bullet){
      if(!inList){ html += "<ul>"; inList = true; }
      html += "<li>"+inline(bullet[1])+"</li>";
      continue;
    }
    if(inList){ html += "</ul>"; inList = false; }
    if(!t){ continue; }
    const h = t.match(/^#{1,4} +(.*)/);
    if(h){ html += "<h4>"+inline(h[1])+"</h4>"; continue; }
    html += "<p>"+inline(t)+"</p>";
  }
  if(inList) html += "</ul>";
  return html;
}

          <button class="btn secondary sm ai-preset" data-q="ช่วยวางแผนการขายและการสั่งของสำหรับสัปดาห์หน้า ควรเติมสินค้าอะไรเท่าไหร่ และควรจัดโปรโมชั่นอะไรบ้าง">🗓️ วางแผนขายสัปดาห์หน้า</button>
          <button class="btn secondary sm ai-preset" data-q="ร้านฉันมีจุดไหนที่ควรปรับปรุงบ้าง ทั้งเรื่องกำไร สต็อก และรายจ่าย ช่วยแนะนำแบบทำได้จริง">💡 หาจุดที่ควรปรับปรุง</button>
        </div>
        <div class="ai-ask">
          <textarea id="aiQ" placeholder="หรือพิมพ์คำถามเอง เช่น สินค้าไหนควรเลิกขาย, ตั้งราคาน้ำดื่มเท่าไหร่ดี..."></textarea>
          <button class="btn" id="aiSend">ถาม</button>
        </div>
        <div id="aiOut">${aiLast ? `<div class="ai-q">คำถาม: ${esc(aiLast.q)}</div><div class="ai-answer">${aiLast.html}</div>` : ""}</div>
      ` : `
        <p style="font-size:14px;color:var(--ink-2);margin-bottom:10px">
          ยังไม่ได้ตั้งค่า API key — สมัครฟรีที่ <b>openrouter.ai</b> → สร้าง API key → นำมาใส่ในหน้าตั้งค่า
          (มีโมเดลฟรีให้ใช้ ไม่ต้องเติมเงินก็เริ่มได้)</p>
        <button class="btn" id="goSet">⚙️ ไปตั้งค่า AI</button>
      `}
    </div>
    <h3 style="font-size:15px;margin-bottom:10px">การวิเคราะห์พื้นฐาน (ทำงานในเครื่อง)</h3>
    <div id="insights"></div>
    <div class="two-col" style="margin-top:16px">
      <div class="card" style="margin-top:0"><h3>สัดส่วนรายจ่าย ${monthName(thisMonth())}</h3><div id="expBreak"></div></div>
      <div class="card" style="margin-top:0"><h3>กำไรขั้นต้นต่อชิ้น (สูงสุด)</h3><div id="marginList"></div></div>
    </div>`;

  // ---- AI handlers ----
  const goSet = el.querySelector("#goSet");
  if(goSet) goSet.onclick = ()=>go("set");
  const runAsk = async q=>{
    q = (q||"").trim();
    if(!q || aiBusy) return;
    aiBusy = true;
    const out = el.querySelector("#aiOut");
    out.innerHTML = `<div class="ai-q">คำถาม: ${esc(q)}</div>
      <div class="ai-answer"><span class="spin"></span> กำลังคิด... (อาจใช้เวลา 10-30 วินาที)</div>`;
    try{
      const ans = await askAI(q);
      aiLast = {q, html: mdToHtml(ans)};
      out.innerHTML = `<div class="ai-q">คำถาม: ${esc(q)}</div><div class="ai-answer">${aiLast.html}</div>`;
    }catch(err){
      const msg = err.name==="TimeoutError" ? "หมดเวลารอ — เน็ตช้าหรือโมเดลไม่ตอบ ลองใหม่อีกครั้ง"
        : (err.message.includes("fetch")||err.name==="TypeError") ? "เชื่อมต่อไม่ได้ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่"
        : err.message;
      out.innerHTML = `<div class="ai-answer" style="border-color:rgba(208,59,59,.5)">⚠️ ${esc(msg)}</div>`;
    }finally{ aiBusy = false; }
  };
  el.querySelectorAll(".ai-preset").forEach(b=>{ b.onclick = ()=>runAsk(b.dataset.q); });
  const sendBtn = el.querySelector("#aiSend");
  if(sendBtn) sendBtn.onclick = ()=>{ runAsk(el.querySelector("#aiQ").value); el.querySelector("#aiQ").value=""; };

  const box = el.querySelector("#insights");
  const insights = buildInsights();
  if(!insights.length){
    box.innerHTML = `<div class="card"><div class="empty"><span class="e-ico">🤖</span>ยังมีข้อมูลไม่พอสำหรับวิเคราะห์ — ลองเพิ่มสินค้าและบันทึกการขายสัก 2-3 วันก่อน</div></div>`;
  }else{
    box.innerHTML = insights.map(i=>`
      <div class="insight ${i.tone||""}">
        <span class="i-ico">${i.ico}</span>
        <div><div class="i-title">${i.title}</div><div class="i-body">${i.body}</div></div>
      </div>`).join("");
  }

  // expense breakdown
  const mk = thisMonth();
  const byCat = {};
  db.transactions.filter(t=>t.type==="expense"&&monthKey(t.date)===mk)
    .forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+t.amount; });
  const expItems = Object.entries(byCat).sort((a,b)=>b[1]-a[1])
    .map(([c,v])=>({name:c, value:v, sub:THB(v)}));
  hBarList(el.querySelector("#expBreak"), expItems, "var(--expense)");

  // margins
  const margins = db.products.filter(p=>p.price>0)
    .map(p=>({name:p.name, value:p.price-p.cost, sub:THB(p.price-p.cost)+` (${p.price>0?Math.round((p.price-p.cost)/p.price*100):0}%)`}))
    .sort((a,b)=>b.value-a.value).slice(0,6);
  hBarList(el.querySelector("#marginList"), margins, "var(--seq)");
}

function buildInsights(){
  const out = [];
  const mk = thisMonth(), today = todayISO();
  const incMonth = monthTx("income", mk), expMonth = monthTx("expense", mk);
  const incLast = lastMonthSamePeriod("income");
  const from30 = daysAgoISO(30);

  // 1) แนวโน้มรายได้ (เทียบช่วงวันที่เท่ากันของเดือนก่อน)
  if(incLast>0){
    const pct = ((incMonth-incLast)/incLast*100);
    if(pct>=5) out.push({ico:"📈",tone:"good",title:`รายรับเดือนนี้โตขึ้น ${pct.toFixed(1)}%`,
      body:`ช่วง ${new Date().getDate()} วันแรกของเดือนนี้ขายได้ ${THB(incMonth)} เทียบกับ ${THB(incLast)} ในช่วงเดียวกันของเดือนก่อน — ทำได้ดีมาก รักษาโมเมนตัมนี้ไว้`});
    else if(pct<=-5) out.push({ico:"📉",tone:"warn",title:`รายรับเดือนนี้ลดลง ${Math.abs(pct).toFixed(1)}%`,
      body:`ช่วง ${new Date().getDate()} วันแรกของเดือนนี้ ${THB(incMonth)} เทียบกับ ${THB(incLast)} ในช่วงเดียวกันของเดือนก่อน — ลองดูว่าสินค้าขายดีหมดสต็อกหรือเปล่า หรือช่วงนี้ลูกค้าน้อยลงเพราะอะไร`});
  }

  // 2) คาดการณ์รายได้เดือนนี้ (run-rate)
  const dayOfMonth = new Date().getDate();
  if(dayOfMonth>=5 && incMonth>0){
    const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    const forecast = incMonth/dayOfMonth*daysInMonth;
    out.push({ico:"🔮",title:`คาดการณ์รายรับสิ้นเดือน ≈ ${THB(Math.round(forecast))}`,
      body:`คำนวณจากยอดขายเฉลี่ย ${THB(Math.round(incMonth/dayOfMonth))}/วัน ในช่วง ${dayOfMonth} วันแรกของเดือน`});
  }

  // 3) กำไร/ขาดทุน
  const profit = incMonth-expMonth;
  if(incMonth>0||expMonth>0){
    if(profit<0) out.push({ico:"🚨",tone:"crit",title:`เดือนนี้ขาดทุน ${THB(Math.abs(profit))}`,
      body:`รายจ่าย (${THB(expMonth)}) มากกว่ารายรับ (${THB(incMonth)}) — ตรวจดูหมวดรายจ่ายที่สูงที่สุดด้านล่าง ถ้าเป็นค่าซื้อสินค้าเข้าอาจไม่น่ากังวลเพราะจะกลายเป็นยอดขายในอนาคต`});
    else if(profit>0 && incMonth>0 && profit/incMonth<0.1) out.push({ico:"⚖️",tone:"warn",title:"กำไรบางมาก (ต่ำกว่า 10% ของยอดขาย)",
      body:`กำไร ${THB(profit)} จากยอดขาย ${THB(incMonth)} — ลองทบทวนราคาขายของสินค้าที่กำไรต่อชิ้นต่ำ หรือหาซัพพลายเออร์ที่ถูกลง`});
  }

  // 4) สินค้าใกล้หมด + แนะนำจำนวนสั่งซื้อ
  const low = lowStockList();
  if(low.length){
    const sales30 = salesQtyByProduct(from30, today);
    const recs = low.slice(0,4).map(p=>{
      const perDay = (sales30[p.id]||0)/30;
      const suggest = Math.max(p.minStock*2, Math.ceil(perDay*14));
      return `${esc(p.name)} (เหลือ ${NUM(p.stock)} → แนะนำสั่งเพิ่ม ~${NUM(Math.max(0,suggest-p.stock))})`;
    });
    out.push({ico:"📦",tone:low.some(p=>p.stock===0)?"crit":"warn",
      title:`มีสินค้าใกล้หมด/หมดแล้ว ${low.length} รายการ`,
      body:`แนะนำเติมของ: ${recs.join(" · ")}${low.length>4?` และอีก ${low.length-4} รายการ`:""} (คำนวณจากยอดขายเฉลี่ย 30 วัน เผื่อขาย 2 สัปดาห์)`});
  }

  // 5) สินค้าขายดี
  const q30 = salesQtyByProduct(from30, today);
  const top = Object.entries(q30).map(([pid,qty])=>({p:prodById(pid),qty})).filter(x=>x.p)
    .sort((a,b)=>b.qty-a.qty);
  if(top.length){
    const t3 = top.slice(0,3).map(x=>`${esc(x.p.name)} (${NUM(x.qty)} ชิ้น)`).join(" · ");
    out.push({ico:"⭐",tone:"good",title:"สินค้าขายดี 30 วันล่าสุด",
      body:`${t3} — อย่าให้ของพวกนี้ขาดสต็อกเด็ดขาด และลองวางไว้จุดที่หยิบง่าย`});
  }

  // 6) สินค้าขายช้า (ไม่มีการขายเลยใน 30 วัน และมีของค้าง)
  const slow = db.products.filter(p=>p.stock>0 && !(q30[p.id]>0) && p.createdAt<=from30);
  if(slow.length){
    const names = slow.slice(0,4).map(p=>esc(p.name)).join(" · ");
    const tied = slow.reduce((s,p)=>s+p.cost*p.stock,0);
    out.push({ico:"🐢",tone:"warn",title:`มีสินค้าขายช้า ${slow.length} รายการ (ไม่มีขายเลย 30 วัน)`,
      body:`${names}${slow.length>4?` และอื่นๆ`:""} — เงินจมอยู่ในสต็อกนี้ ${THB(tied)} ลองจัดโปรลดราคา หรือครั้งหน้าซื้อเข้าน้อยลง`});
  }

  // 7) สินค้ากำไรต่ำ
  const lowMargin = db.products.filter(p=>p.price>0 && (p.price-p.cost)/p.price < 0.15 && (q30[p.id]||0)>0);
  if(lowMargin.length){
    const names = lowMargin.slice(0,3).map(p=>`${esc(p.name)} (${Math.round((p.price-p.cost)/p.price*100)}%)`).join(" · ");
    out.push({ico:"💸",tone:"warn",title:"สินค้าที่กำไรต่อชิ้นต่ำกว่า 15%",
      body:`${names} — ถ้าขายดีอยู่แล้ว ลองขยับราคาขึ้นเล็กน้อย หรือต่อรองราคาทุนกับร้านที่ซื้อเข้า`});
  }

  // 8) วันขายดีที่สุดของสัปดาห์
  const dayTotals = [0,0,0,0,0,0,0], dayCounts=[0,0,0,0,0,0,0];
  db.transactions.filter(t=>t.type==="income"&&t.date>=daysAgoISO(60)).forEach(t=>{
    const dow = new Date(t.date+"T00:00:00").getDay();
    dayTotals[dow]+=t.amount; dayCounts[dow]++;
  });
  const activeDays = dayCounts.filter(c=>c>0).length;
  if(activeDays>=4){
    const names=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสฯ","ศุกร์","เสาร์"];
    let best=0; dayTotals.forEach((v,i)=>{ if(v>dayTotals[best]) best=i; });
    out.push({ico:"📅",title:`วัน${names[best]}คือวันขายดีที่สุดของร้าน`,
      body:`ยอดขายรวม 60 วันล่าสุดสูงสุดในวัน${names[best]} (${THB(dayTotals[best])}) — เตรียมสต็อกให้พร้อมก่อนวันนั้น และอาจจัดโปรในวันที่ขายช้าเพื่อดึงลูกค้า`});
  }

  return out;
}

const CELL = 44; // ขนาด 1 ช่องกริด (px)
const FIXTYPES = {
  shelf:   {name:"ชั้นวางของ",   ico:"🗄️", color:"#8c6a4f", w:4, h:1},
  fridge:  {name:"ตู้แช่เย็น",   ico:"🧊", color:"#2a78d6", w:2, h:1},
  icecream:{name:"ตู้ไอติม",     ico:"🍦", color:"#c94f79", w:2, h:1},
  freezer: {name:"ตู้แช่แข็ง",   ico:"❄️", color:"#4a3aa7", w:2, h:1},
  counter: {name:"เคาน์เตอร์คิดเงิน", ico:"💵", color:"#a97400", w:3, h:1},
  table:   {name:"โต๊ะ",         ico:"🪑", color:"#6b6963", w:2, h:2},
  door:    {name:"ประตูเข้า",    ico:"🚪", color:"#0a7d0a", w:2, h:1},
  wall:    {name:"ผนัง/ฉากกั้น",  ico:"▪️", color:"#43423e", w:1, h:3}
};
let planSel = null; // id ของ fixture ที่เลือกอยู่

function planFits(items, ignoreId, x, y, w, h){
  const L = db.layout;
  if(x<0 || y<0 || x+w>L.cols || y+h>L.rows) return false;
  return !items.some(o=>{
    if(o.id===ignoreId) return false;
    return x < o.x+o.w && x+w > o.x && y < o.y+o.h && y+h > o.y;
  });
}
function planFindFree(w, h){
  const L = db.layout;
  for(let y=0; y<=L.rows-h; y++)
    for(let x=0; x<=L.cols-w; x++)
      if(planFits(L.items, null, x, y, w, h)) return {x,y};
  return null;
}
function fixtureStatus(item){
  const prods = (item.productIds||[]).map(prodById).filter(Boolean);
  if(prods.some(p=>p.stock===0)) return "red";
  if(prods.some(p=>p.stock<=p.minStock)) return "yellow";
  return null;
}

  const drawGrid = ()=>{

    }).join("") + (L.items.length ? "" :
      `<div class="empty" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span class="e-ico">🗺️</span>ร้านยังว่าง — แตะปุ่มด้านบน เช่น "🗄️ ชั้นวางของ" เพื่อเริ่มวางผัง</div>`);
    grid.querySelectorAll(".fixture").forEach(bindFixture);
  };

  const drawProps = ()=>{
    const box = el.querySelector("#planProps");
    const it = db.layout.items.find(i=>i.id===planSel);
    if(!it){ box.innerHTML = ""; return; }

          <span style="font-size:18px">${t.ico}</span>

          <span class="small muted">กว้าง</span>
          <span class="qty-ctl"><button data-p="w-">−</button><span>${it.w}</span><button data-p="w+">+</button></span>
          <span class="small muted">ลึก</span>
          <span class="qty-ctl"><button data-p="h-">−</button><span>${it.h}</span><button data-p="h+">+</button></span>
          <button class="btn secondary sm" id="fxRot">🔄 หมุน</button>

            ${db.products.map(p=>{
              const chk = pids.includes(p.id);
              const badge = p.stock===0?`<span class="badge out">หมด</span>`

                : `<span class="small muted">เหลือ ${NUM(p.stock)}</span>`;

      </div>`;
    box.querySelector("#fxLabel").oninput = e=>{ it.label = e.target.value; save(); drawGridSoft(); };
    box.querySelectorAll("[data-p]").forEach(b=>{
      b.onclick = ()=>{
        let {w,h} = it;
        if(b.dataset.p==="w+") w++; if(b.dataset.p==="w-") w--;
        if(b.dataset.p==="h+") h++; if(b.dataset.p==="h-") h--;
        if(w<1||h<1) return;
        if(planFits(db.layout.items, it.id, it.x, it.y, w, h)){ it.w=w; it.h=h; save(); drawGrid(); drawProps(); }
      };
    });
    box.querySelector("#fxRot").onclick = ()=>{
      if(planFits(db.layout.items, it.id, it.x, it.y, it.h, it.w)){
        [it.w, it.h] = [it.h, it.w]; save(); drawGrid(); drawProps();
      }
    };
    box.querySelector("#fxDup").onclick = ()=>{
      const spot = planFits(db.layout.items, null, it.x+it.w, it.y, it.w, it.h) ? {x:it.x+it.w, y:it.y}
        : planFits(db.layout.items, null, it.x, it.y+it.h, it.w, it.h) ? {x:it.x, y:it.y+it.h}
        : planFindFree(it.w, it.h);
      if(!spot){ alert("วางทำซ้ำไม่ได้ — พื้นที่เต็มแล้ว ลองขยายขนาดร้านก่อน (ปุ่ม + ด้านขวาบน)"); return; }
      const copy = {id:uid(), type:it.type, x:spot.x, y:spot.y, w:it.w, h:it.h,
        label:it.label, productIds:[...(it.productIds||[])]};
      db.layout.items.push(copy);
      planSel = copy.id; save(); drawGrid(); drawProps();
    };
    box.querySelector("#fxDel").onclick = ()=>confirmBox(`ลบ "${esc(it.label||t.name)}" ออกจากแปลน?`, ()=>{
      db.layout.items = db.layout.items.filter(x=>x.id!==it.id);
      planSel = null; save(); drawGrid(); drawProps();
    });
    box.querySelectorAll("[data-pid]").forEach(cb=>{
      cb.onchange = ()=>{
        const pid = cb.dataset.pid;
        if(cb.checked){ if(!pids.includes(pid)) pids.push(pid); }
        else it.productIds = it.productIds.filter(x=>x!==pid);
        save(); drawGridSoft(); drawProps();
      };
    });
  };
  // อัปเดตป้าย/จุดสถานะโดยไม่ rebuild ทั้งกริด (กัน focus หลุดจากช่องชื่อ)
  const drawGridSoft = ()=>{
    const it = db.layout.items.find(i=>i.id===planSel);
    if(!it) return;
    const elFx = grid.querySelector(`.fixture[data-id="${it.id}"]`);
    if(!elFx) return;
    const t = FIXTYPES[it.type] || FIXTYPES.shelf;
    const lbl = elFx.querySelector("span:nth-child(2)");
    if(lbl && !lbl.classList.contains("fx-dot")) lbl.textContent = it.label || t.name;
    elFx.querySelector(".fx-dot")?.remove();
    const st = fixtureStatus(it);
    if(st) elFx.insertAdjacentHTML("beforeend", `<span class="fx-dot ${st}"></span>`);
  };

  const bindFixture = fx=>{
    const it = db.layout.items.find(i=>i.id===fx.dataset.id);
    fx.addEventListener("pointerdown", e=>{
      e.preventDefault();
      fx.setPointerCapture(e.pointerId);
      const startX = e.clientX, startY = e.clientY;
      const origX = it.x, origY = it.y;
      let moved = false, gx = it.x, gy = it.y;
      const onMove = ev=>{
        const dx = ev.clientX-startX, dy = ev.clientY-startY;
        if(!moved && Math.hypot(dx,dy) < 6) return;
        moved = true;
        fx.classList.add("dragging");
        gx = Math.max(0, Math.min(db.layout.cols-it.w, origX + Math.round(dx/CELL)));
        gy = Math.max(0, Math.min(db.layout.rows-it.h, origY + Math.round(dy/CELL)));
        fx.style.left = gx*CELL+2+"px";
        fx.style.top = gy*CELL+2+"px";
        fx.classList.toggle("bad", !planFits(db.layout.items, it.id, gx, gy, it.w, it.h));
      };
      const onUp = ()=>{
        fx.removeEventListener("pointermove", onMove);
        fx.removeEventListener("pointerup", onUp);
        fx.removeEventListener("pointercancel", onUp);
        fx.classList.remove("dragging","bad");
        if(moved){
          if(planFits(db.layout.items, it.id, gx, gy, it.w, it.h)){ it.x=gx; it.y=gy; save(); }
          drawGrid();
        }else{
          planSel = (planSel===it.id) ? null : it.id;
          drawGrid(); drawProps();
        }
      };
      fx.addEventListener("pointermove", onMove);
      fx.addEventListener("pointerup", onUp);
      fx.addEventListener("pointercancel", onUp);
    });
  };

  el.querySelector("#palette").querySelectorAll("[data-t]").forEach(b=>{
    b.onclick = ()=>{
      const t = FIXTYPES[b.dataset.t];
      const spot = planFindFree(t.w, t.h) || planFindFree(1,1);
      if(!spot){ alert("แปลนเต็มแล้ว — ขยายขนาดร้านก่อน (ปุ่ม + ด้านขวาบน)"); return; }
      const it = {id:uid(), type:b.dataset.t, x:spot.x, y:spot.y,
        w:Math.min(t.w, db.layout.cols), h:Math.min(t.h, db.layout.rows), label:"", productIds:[]};
      db.layout.items.push(it);
      planSel = it.id; save(); drawGrid(); drawProps();
    };
  });
  const resize = (key, d)=>{
    const L = db.layout;
    const min = key==="cols"
      ? Math.max(6, ...L.items.map(i=>i.x+i.w))
      : Math.max(6, ...L.items.map(i=>i.y+i.h));
    const v = L[key]+d;
    if(v<min || v>40) return;
    L[key] = v; save();
    el.querySelector(key==="cols"?"#colsVal":"#rowsVal").textContent = v;
    drawGrid();
  };
  el.querySelector("#colsInc").onclick = ()=>resize("cols", 1);
  el.querySelector("#colsDec").onclick = ()=>resize("cols",-1);
  el.querySelector("#rowsInc").onclick = ()=>resize("rows", 1);
  el.querySelector("#rowsDec").onclick = ()=>resize("rows",-1);

  drawGrid(); drawProps();
}

/* ---------- demo data ---------- */
function seedDemo(){
  const cats = [
    ["น้ำดื่ม 600ml","เครื่องดื่ม",5,10],["น้ำอัดลมกระป๋อง","เครื่องดื่ม",12,20],["กาแฟกระป๋อง","เครื่องดื่ม",13,20],
    ["มาม่า","อาหารแห้ง",5.5,8],["ปลากระป๋อง","อาหารแห้ง",14,20],["ข้าวสาร 5กก.","อาหารแห้ง",120,155],
    ["ขนมถุง","ขนม",8,12],["เวเฟอร์","ขนม",4,6],
    ["ผงซักฟอก","ของใช้",28,38],["สบู่ก้อน","ของใช้",10,15],["ยาสีฟัน","ของใช้",25,35],["ทิชชู่ม้วน","ของใช้",9,14]
  ];
  const prods = cats.map(([name,category,cost,price])=>({
    id:uid()+Math.random().toString(36).slice(2,5), name, category, cost, price,
    stock: 10+Math.floor(Math.random()*40), minStock:5, createdAt: daysAgoISO(60)
  }));
  db.products.push(...prods);
  // 45 days of sales
  for(let d=45; d>=0; d--){
    const iso = daysAgoISO(d);
    const dow = new Date(iso+"T00:00:00").getDay();
    const nSales = 2+Math.floor(Math.random()*4)+(dow===0||dow===6?2:0);
    let dayTotal=0, items=[];
    for(let s=0;s<nSales;s++){
      const p = prods[Math.floor(Math.random()*prods.length)];
      const qty = 1+Math.floor(Math.random()*4);
      const total = qty*p.price;
      dayTotal+=total; items.push(p.name+"×"+qty);
      db.movements.push({id:uid()+s, productId:p.id, type:"out", qty, unit:p.price, total, profit:qty*(p.price-p.cost), note:"ขายหน้าร้าน", date:iso});
    }
    db.transactions.push({id:uid()+"i"+d, type:"income", category:"ขายสินค้า", amount:dayTotal, note:"ขาย: "+items.slice(0,3).join(", ")+(items.length>3?" ...":""), date:iso});
    if(d%7===0){
      const buy = 800+Math.floor(Math.random()*1200);
      db.transactions.push({id:uid()+"e"+d, type:"expense", category:"ซื้อสินค้าเข้า", amount:buy, note:"ซื้อของเข้าร้านประจำสัปดาห์", date:iso});
    }
  }
  const mk = thisMonth();
  db.transactions.push({id:uid()+"r", type:"expense", category:"ค่าเช่า", amount:3500, note:"ค่าเช่าร้าน", date:mk+"-01"});
  db.transactions.push({id:uid()+"u", type:"expense", category:"ค่าน้ำ-ค่าไฟ", amount:850, note:"ค่าไฟเดือนนี้", date:mk+"-03"});
  db.employees.push({id:uid()+"emp", name:"น้องชาย", role:"ดูแลร้าน", phone:"", salary:6000, startDate:daysAgoISO(90), active:true});
  // make a few items low-stock for the demo
  prods[0].stock = 2; prods[3].stock = 0; prods[6].stock = 3;
  // demo shop layout
  if(!db.layout.items.length){
    const pid = n => prods[n].id;
    db.layout.items = [
      {id:uid()+"d1", type:"door",    x:6,  y:9, w:2, h:1, label:"", productIds:[]},
      {id:uid()+"c1", type:"counter", x:0,  y:8, w:3, h:1, label:"", productIds:[]},
      {id:uid()+"s1", type:"shelf",   x:1,  y:1, w:5, h:1, label:"ชั้นขนม",   productIds:[pid(6),pid(7)]},
      {id:uid()+"s2", type:"shelf",   x:1,  y:3, w:5, h:1, label:"ชั้นของแห้ง", productIds:[pid(3),pid(4),pid(5)]},
      {id:uid()+"s3", type:"shelf",   x:1,  y:5, w:5, h:1, label:"ชั้นของใช้", productIds:[pid(8),pid(9),pid(10),pid(11)]},
      {id:uid()+"f1", type:"fridge",  x:13, y:1, w:2, h:2, label:"", productIds:[pid(0),pid(1),pid(2)]},
      {id:uid()+"i1", type:"icecream",x:13, y:5, w:2, h:1, label:"", productIds:[]}
    ];
  }
  save();
}

/* ---------- โหมดมืด/สว่าง (เลือกเองได้ ค่าเริ่มต้นตามเครื่อง) ---------- */
const THEME_KEY = "lmm_theme";
function systemPrefersDark(){ return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
function currentTheme(){ return document.documentElement.getAttribute("data-theme") || (systemPrefersDark() ? "dark" : "light"); }
function setTheme(t){
  if(t){ localStorage.setItem(THEME_KEY, t); document.documentElement.setAttribute("data-theme", t); }
  else{ localStorage.removeItem(THEME_KEY); document.documentElement.removeAttribute("data-theme"); }
  syncThemeIcons();
}
function toggleTheme(){ setTheme(currentTheme()==="dark" ? "light" : "dark"); }
function syncThemeIcons(){
  const dark = currentTheme()==="dark";
  document.querySelectorAll(".theme-toggle").forEach(b=>{
    b.textContent = dark ? "☀️" : "🌙";
    b.title = dark ? "สลับเป็นโหมดสว่าง" : "สลับเป็นโหมดมืด";
  });
}

/* ---------- boot ---------- */
function applyBrand(){
  document.getElementById("brandName").textContent = db.shop.name;
  document.getElementById("brandNameM").textContent = db.shop.name;
  document.title = db.shop.name + " — ระบบจัดการร้านค้า";
}
applyBrand();
document.querySelectorAll(".theme-toggle").forEach(b=>{ b.onclick = toggleTheme; });
syncThemeIcons();
go("dash");
</script>
